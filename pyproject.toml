[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-triage"
version = "0.3.0"
description = "Standing rules for your mail: delete the routine, and queue the rest for a decision, each email once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "m365-graph>=0.1.1",     # sign-in and Graph requests; not on PyPI, see README
    "win-background>=0.1",   # the scheduled task, notifications, the run lock and the log; not on PyPI, see README
]

[project.scripts]
mail-triage = "mail_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
